<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726" />
      <stop offset="100%" stop-color="#102A44" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)" />

  <!-- Chasis y Módulos PLC estilo Siemens S7-1200 / Delta DVP -->
  <g transform="translate(140, 240)">
    <!-- Riel DIN de fondo -->
    <rect x="-60" y="-10" width="220" height="20" fill="#4B6075" stroke="#1D2A38" />

    <!-- CPU PLC Principal -->
    <rect x="-40" y="-110" width="100" height="220" rx="6" fill="#142F4A" stroke="#168BFF" stroke-width="2.5" />
    <text x="10" y="-85" font-family="'Manrope', sans-serif" font-size="12" font-weight="extrabold" fill="#FFFFFF" text-anchor="middle">CPU PLC</text>
    <!-- LEDs de estado RUN / STOP / ERROR -->
    <circle cx="-15" cy="-60" r="5" fill="#3DDC97" />
    <text x="-2" y="-56" font-family="sans-serif" font-size="9" fill="#3DDC97">RUN</text>
    <circle cx="-15" cy="-40" r="5" fill="#486581" />
    <text x="-2" y="-36" font-family="sans-serif" font-size="9" fill="#8FA4B8">STOP</text>
    <circle cx="-15" cy="-20" r="5" fill="#486581" />
    <text x="-2" y="-16" font-family="sans-serif" font-size="9" fill="#8FA4B8">ERR</text>

    <!-- Borneras de entrada/salida -->
    <rect x="-30" y="20" width="80" height="70" fill="#0A1826" rx="3" />
    <circle cx="-18" cy="35" r="4" fill="#3DDC97" />
    <circle cx="-5" cy="35" r="4" fill="#3DDC97" />
    <circle cx="8" cy="35" r="4" fill="#3DDC97" />
    <circle cx="21" cy="35" r="4" fill="#3DDC97" />
    <circle cx="-18" cy="65" r="4" fill="#168BFF" />
    <circle cx="-5" cy="65" r="4" fill="#168BFF" />
    <circle cx="8" cy="65" r="4" fill="#168BFF" />
    <circle cx="21" cy="65" r="4" fill="#168BFF" />

    <!-- Módulo de Expansión I/O -->
    <rect x="70" y="-110" width="65" height="220" rx="6" fill="#183654" stroke="#168BFF" stroke-width="2" />
    <text x="102" y="-85" font-family="'Manrope', sans-serif" font-size="10" font-weight="bold" fill="#8FA4B8" text-anchor="middle">AI / AO</text>
    <rect x="78" y="20" width="50" height="70" fill="#0A1826" rx="3" />
  </g>

  <!-- Cable de comunicación Industrial Ethernet / Profinet / RS485 -->
  <path d="M 275 220 Q 340 160 410 200" fill="none" stroke="#3DDC97" stroke-width="4" stroke-dasharray="6 3" />
  <circle cx="275" cy="220" r="5" fill="#3DDC97" />

  <!-- Panel HMI / Pantalla Táctil Touch Screen -->
  <g transform="translate(560, 240)">
    <!-- Marco de HMI -->
    <rect x="-150" y="-110" width="300" height="220" rx="12" fill="#142738" stroke="#3DDC97" stroke-width="3" />
    <!-- Pantalla LCD -->
    <rect x="-130" y="-90" width="260" height="180" rx="6" fill="#06121E" stroke="#168BFF" stroke-width="1.5" />

    <!-- Gráficos de supervisión SCADA dentro del HMI -->
    <!-- Sinóptico de tuberías y botones -->
    <path d="M -110 -20 L -20 -20 L -20 40 L 40 40" fill="none" stroke="#168BFF" stroke-width="4" />
    <circle cx="-20" cy="-20" r="12" fill="#3DDC97" />
    <circle cx="40" cy="40" r="12" fill="#168BFF" />

    <!-- Barra de nivel o producción -->
    <rect x="60" y="-60" width="50" height="120" rx="4" fill="#0F2438" />
    <rect x="60" y="-10" width="50" height="70" rx="4" fill="#3DDC97" />
    <text x="85" y="-20" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">70%</text>

    <!-- Botones táctiles virtuales -->
    <rect x="-110" y="50" width="60" height="25" rx="4" fill="#168BFF" />
    <text x="-80" y="66" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AUTO</text>

    <rect x="-40" y="50" width="60" height="25" rx="4" fill="#25384B" />
    <text x="-10" y="66" font-family="sans-serif" font-size="10" font-weight="bold" fill="#8FA4B8" text-anchor="middle">MAN</text>

    <text x="-110" y="-65" font-family="'Manrope', sans-serif" font-size="14" font-weight="bold" fill="#3DDC97">LÍNEA 01 - ACTIVA</text>
  </g>

  <text x="50" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#168BFF">LÓGICA &amp; SUPERVISIÓN</text>
  <text x="50" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">PLC y Pantallas HMI</text>
  <text x="50" y="120" font-family="sans-serif" font-size="12" fill="#8FA4B8">Ladder · Structured Text · Pantallas de control intuitivas</text>
</svg>
