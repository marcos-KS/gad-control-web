<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726" />
      <stop offset="100%" stop-color="#102A44" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg8)" />

  <!-- Cámara termográfica / Scanner de diagnóstico -->
  <g transform="translate(230, 240)">
    <!-- Pantalla de análisis con termografía / mapa de calor -->
    <rect x="-140" y="-110" width="280" height="200" rx="10" fill="#0C1926" stroke="#168BFF" stroke-width="2.5" />

    <!-- Mapa de calor en componente -->
    <circle cx="20" cy="-10" r="60" fill="#FF5722" fill-opacity="0.3" />
    <circle cx="20" cy="-10" r="40" fill="#FFA500" fill-opacity="0.5" />
    <circle cx="20" cy="-10" r="20" fill="#E2000F" fill-opacity="0.8" />
    <circle cx="20" cy="-10" r="8" fill="#FFFFFF" />

    <!-- Retículo de mira de diagnóstico -->
    <line x1="0" y1="-10" x2="40" y2="-10" stroke="#FFFFFF" stroke-width="2" />
    <line x1="20" y1="-30" x2="20" y2="10" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="20" cy="-10" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3" />

    <text x="50" y="-20" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#FFA500">HOTSPOT 72.4°C</text>
    <text x="-120" y="70" font-family="'Courier New', monospace" font-size="12" fill="#3DDC97">ESTADO: INSPECCIÓN OK</text>
  </g>

  <!-- Llave de mantenimiento y engranajes técnicos -->
  <g transform="translate(570, 230)">
    <!-- Engranaje de ajuste -->
    <circle cx="0" cy="0" r="65" fill="#152B3E" stroke="#3DDC97" stroke-width="3" />
    <circle cx="0" cy="0" r="30" fill="#0A1826" stroke="#168BFF" stroke-width="2" />
    <!-- Dientes del engranaje -->
    <rect x="-10" y="-75" width="20" height="150" fill="#3DDC97" rx="3" />
    <rect x="-75" y="-10" width="150" height="20" fill="#3DDC97" rx="3" />
    <rect x="-55" y="-55" width="110" height="110" fill="none" stroke="#3DDC97" stroke-width="14" rx="6" stroke-dasharray="16 16" />

    <!-- Llave fija inglesa cruzada -->
    <g transform="rotate(45)">
      <rect x="-12" y="-110" width="24" height="220" rx="8" fill="#90A4B8" stroke="#102030" stroke-width="2" />
      <path d="M -24 -110 C -24 -135 24 -135 24 -110 L 10 -95 L -10 -95 Z" fill="#90A4B8" />
    </g>
  </g>

  <text x="50" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#3DDC97">PREVENTIVO &amp; CORRECTIVO</text>
  <text x="50" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Diagnóstico, Mantenimiento y Mejoras</text>
  <text x="50" y="120" font-family="sans-serif" font-size="12" fill="#8FA4B8">Detección de falsos contactos · Ruido eléctrico · Optimización de paradas</text>
</svg>
