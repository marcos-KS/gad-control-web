<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726" />
      <stop offset="100%" stop-color="#102A44" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)" />

  <!-- Gabinete Eléctrico Industrial Rittal / Estándar -->
  <g transform="translate(400, 245)">
    <!-- Armario exterior -->
    <rect x="-240" y="-125" width="480" height="250" rx="8" fill="#132638" stroke="#168BFF" stroke-width="3" />
    <rect x="-225" y="-110" width="450" height="220" rx="4" fill="#0C1B28" stroke="#253E57" stroke-width="1.5" />

    <!-- Canaletas ranuradas ranuradas de distribución (cable duct) -->
    <rect x="-210" y="-100" width="25" height="200" fill="#203345" stroke="#142330" />
    <rect x="185" y="-100" width="25" height="200" fill="#203345" stroke="#142330" />
    <rect x="-185" y="-30" width="370" height="25" fill="#203345" stroke="#142330" />

    <!-- Riel DIN superior: Termomagnéticas, Disyuntor, Guardamotor -->
    <rect x="-185" y="-85" width="370" height="8" fill="#50667D" />

    <!-- Interruptor Principal / Seccionador -->
    <rect x="-170" y="-95" width="40" height="55" rx="3" fill="#D7141A" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="-150" cy="-68" r="8" fill="#FFFFFF" />

    <!-- Llaves térmicas y diferenciales modulares -->
    <rect x="-115" y="-95" width="22" height="50" rx="2" fill="#E8EDF2" stroke="#203345" />
    <rect x="-90" y="-95" width="22" height="50" rx="2" fill="#E8EDF2" stroke="#203345" />
    <rect x="-65" y="-95" width="22" height="50" rx="2" fill="#E8EDF2" stroke="#203345" />
    <rect x="-40" y="-95" width="22" height="50" rx="2" fill="#E8EDF2" stroke="#203345" />
    <rect x="-15" y="-95" width="32" height="50" rx="2" fill="#2D4661" stroke="#3DDC97" stroke-width="1.5" />

    <!-- Contactores y Relés térmicos -->
    <rect x="30" y="-95" width="45" height="52" rx="3" fill="#1C354D" stroke="#168BFF" stroke-width="1.5" />
    <circle cx="52" cy="-80" r="5" fill="#3DDC97" />
    <rect x="85" y="-95" width="45" height="52" rx="3" fill="#1C354D" stroke="#168BFF" stroke-width="1.5" />
    <circle cx="107" cy="-80" r="5" fill="#3DDC97" />

    <!-- Fuente de alimentación 24V DC -->
    <rect x="140" y="-95" width="35" height="55" rx="3" fill="#14314E" stroke="#3DDC97" stroke-width="2" />
    <text x="157" y="-62" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#3DDC97" text-anchor="middle">24V</text>

    <!-- Riel DIN inferior: Borneras de conexión numeradas (Weidmüller / Phoenix) -->
    <rect x="-185" y="45" width="370" height="8" fill="#50667D" />
    <g transform="translate(-160, 25)">
      <!-- Fila de borneras con cables ordenados -->
      <rect x="0" y="0" width="12" height="42" fill="#758A99" stroke="#14212E" />
      <rect x="14" y="0" width="12" height="42" fill="#758A99" stroke="#14212E" />
      <rect x="28" y="0" width="12" height="42" fill="#3DDC97" stroke="#14212E" />
      <rect x="42" y="0" width="12" height="42" fill="#168BFF" stroke="#14212E" />
      <rect x="56" y="0" width="12" height="42" fill="#E2000F" stroke="#14212E" />
      <rect x="70" y="0" width="12" height="42" fill="#758A99" stroke="#14212E" />
      <rect x="84" y="0" width="12" height="42" fill="#758A99" stroke="#14212E" />
      <rect x="98" y="0" width="12" height="42" fill="#3DDC97" stroke="#14212E" />
      <rect x="112" y="0" width="12" height="42" fill="#168BFF" stroke="#14212E" />
    </g>

    <!-- Puerta entreabierta con pilotos y pulsadores de marcha/parada -->
    <g transform="translate(180, 20)">
      <circle cx="20" cy="-60" r="9" fill="#3DDC97" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="20" cy="-35" r="9" fill="#E2000F" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="20" cy="-10" r="9" fill="#FFA500" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>

  <text x="50" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#3DDC97">DISEÑO &amp; MONTAJE</text>
  <text x="50" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Tableros Eléctricos y de Control</text>
  <text x="50" y="120" font-family="sans-serif" font-size="12" fill="#8FA4B8">Comando y potencia · Canalizado ordenado · Planos y borneras identificadas</text>
</svg>
