<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726" />
      <stop offset="100%" stop-color="#102A44" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg9)" />

  <!-- Nube / Red Central de Comunicación Industrial (Gateway / Switch) -->
  <g transform="translate(400, 240)">
    <!-- Switch / Router Industrial de carril DIN -->
    <rect x="-80" y="-60" width="160" height="120" rx="10" fill="#142C44" stroke="#3DDC97" stroke-width="3" />
    <text x="0" y="-20" font-family="'Manrope', sans-serif" font-size="14" font-weight="extrabold" fill="#FFFFFF" text-anchor="middle">SWITCH ETHERNET</text>
    <text x="0" y="2" font-family="sans-serif" font-size="10" fill="#3DDC97" text-anchor="middle">Modbus TCP / Profinet</text>

    <!-- Puertos RJ45 con LEDs parpadeantes -->
    <rect x="-60" y="16" width="22" height="24" rx="3" fill="#07131F" />
    <circle cx="-49" cy="46" r="3" fill="#3DDC97" />
    <rect x="-30" y="16" width="22" height="24" rx="3" fill="#07131F" />
    <circle cx="-19" cy="46" r="3" fill="#3DDC97" />
    <rect x="8" y="16" width="22" height="24" rx="3" fill="#07131F" />
    <circle cx="19" cy="46" r="3" fill="#168BFF" />
    <rect x="38" y="16" width="22" height="24" rx="3" fill="#07131F" />
    <circle cx="49" cy="46" r="3" fill="#3DDC97" />
  </g>

  <!-- Nodos periféricos interconectados -->
  <!-- Nodo PLC -->
  <g transform="translate(140, 180)">
    <rect x="-50" y="-40" width="100" height="80" rx="8" fill="#183654" stroke="#168BFF" stroke-width="2" />
    <text x="0" y="5" font-family="'Manrope', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PLC Delta/Siemens</text>
    <path d="M 50 0 L 180 40" fill="none" stroke="#168BFF" stroke-width="3" stroke-dasharray="6 4" />
  </g>

  <!-- Nodo Variador de Frecuencia / Inverter (Danfoss) -->
  <g transform="translate(150, 330)">
    <rect x="-55" y="-35" width="110" height="70" rx="8" fill="#183654" stroke="#E2000F" stroke-width="2" />
    <text x="0" y="5" font-family="'Manrope', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VFD Danfoss</text>
    <path d="M 55 0 L 170 -70" fill="none" stroke="#3DDC97" stroke-width="3" />
  </g>

  <!-- Nodo HMI / SCADA -->
  <g transform="translate(650, 180)">
    <rect x="-50" y="-40" width="100" height="80" rx="8" fill="#183654" stroke="#3DDC97" stroke-width="2" />
    <text x="0" y="5" font-family="'Manrope', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HMI / SCADA</text>
    <path d="M -50 0 L -170 40" fill="none" stroke="#3DDC97" stroke-width="3" />
  </g>

  <!-- Nodo Instrumentación de Campo (Sensor Keyence) -->
  <g transform="translate(650, 330)">
    <rect x="-55" y="-35" width="110" height="70" rx="8" fill="#183654" stroke="#168BFF" stroke-width="2" />
    <text x="0" y="5" font-family="'Manrope', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Keyence / Sensores</text>
    <path d="M -55 0 L -170 -70" fill="none" stroke="#168BFF" stroke-width="3" stroke-dasharray="6 4" />
  </g>

  <text x="50" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#168BFF">INTERCONEXIÓN MULTIMARCA</text>
  <text x="50" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Integración de Equipos y Sistemas</text>
  <text x="50" y="120" font-family="sans-serif" font-size="12" fill="#8FA4B8">Redes de campo RS-485 · Ethernet Industrial · Pasarelas de comunicación</text>
</svg>
