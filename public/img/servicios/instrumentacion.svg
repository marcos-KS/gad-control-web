<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F33" />
      <stop offset="100%" stop-color="#10304F" />
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4D60" />
      <stop offset="50%" stop-color="#6C8299" />
      <stop offset="100%" stop-color="#223242" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#3DDC97" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg1)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Cañería de proceso principal -->
  <rect x="0" y="290" width="800" height="70" fill="url(#pipe)" />
  <!-- Bridas -->
  <rect x="340" y="275" width="20" height="100" rx="3" fill="#4B6075" stroke="#102131" stroke-width="2" />
  <rect x="440" y="275" width="20" height="100" rx="3" fill="#4B6075" stroke="#102131" stroke-width="2" />

  <!-- Cuello de conexión a instrumento -->
  <rect x="385" y="220" width="30" height="70" fill="url(#pipe)" />
  <rect x="375" y="210" width="50" height="14" rx="2" fill="#526171" />

  <!-- Carcasa del instrumento / transmisor de presión/caudal -->
  <circle cx="400" cy="140" r="75" fill="#142C44" stroke="#168BFF" stroke-width="5" />
  <circle cx="400" cy="140" r="62" fill="#0B1A28" stroke="#3DDC97" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Display digital HMI/LCD -->
  <rect x="355" y="112" width="90" height="45" rx="5" fill="#05101A" stroke="#168BFF" stroke-width="1.5" />
  <text x="400" y="136" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#3DDC97" text-anchor="middle">101.3</text>
  <text x="400" y="150" font-family="sans-serif" font-size="10" font-weight="bold" fill="#168BFF" text-anchor="middle">kPa · 4-20mA</text>

  <!-- Barra de progreso/gráfico en el dial -->
  <path d="M 345 140 A 55 55 0 0 1 455 140" fill="none" stroke="#223F5E" stroke-width="6" stroke-linecap="round" />
  <path d="M 345 140 A 55 55 0 0 1 435 105" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" />

  <!-- Ondas / Señal telemetry de campo -->
  <path d="M 490 120 A 40 40 0 0 1 490 160" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />
  <path d="M 505 105 A 60 60 0 0 1 505 175" fill="none" stroke="#168BFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" />

  <!-- Conexión eléctrica con glándula / conduit -->
  <path d="M 465 170 L 530 200 L 530 290" fill="none" stroke="#3DDC97" stroke-width="4" stroke-dasharray="8 4" />
  <circle cx="465" cy="170" r="5" fill="#3DDC97" />

  <!-- Textos técnicos decorativos de instrumentación -->
  <text x="50" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#168BFF">CALIBRACIÓN &amp; MEDICIÓN</text>
  <text x="50" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Instrumentación Industrial de Campo</text>
  <text x="50" y="120" font-family="sans-serif" font-size="12" fill="#8FA4B8">HART · Profibus · Lazo de 2 hilos activo</text>
</svg>
